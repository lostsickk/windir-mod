<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>WINDIR PROXY</title>
<link rel="stylesheet" href="/style.css">
</head><body>

<canvas id="particles"></canvas>
<div class="ambient"></div>

<div class="page">
  <header class="header">
    <div class="brand">
      <div class="brand-icon"><img class="code-icon" src="/avatar.jpg" alt="WINDIR"></div>
      <div class="brand-name">WINDIR <span>PROXY</span></div>
    </div>
  </header>

  <main class="content">
    <div class="login-box">
      <div class="panel">

        <div class="input-wrapper">
          <div class="input-glow"></div>
          <input id="keyInput" class="key-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Enter your key">
        </div>

        <div class="ip-row">
          <input id="ipInput" class="ip-input" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="15" placeholder="Your IPv4 address">
          <button id="detectIpButton" class="detect-button" type="button">Auto-detect</button>
        </div>

        <div id="ipStatus" class="ip-status"></div>

        <div class="save-row">
          <label class="save-label">
            <input id="saveKey" class="save-checkbox" type="checkbox">
            <span>Remember my key</span>
          </label>
          <button id="clearKey" class="clear-key" type="button">Clear saved key</button>
        </div>

        <button id="loginButton" class="login-button" type="button" disabled>Enter Key</button>

        <div id="status" class="status"></div>

      </div>
    </div>
  </main>
</div>

<script src="/app.js"></script>
</body></html>
